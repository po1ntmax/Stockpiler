name: Build and Release

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    tags:
      - 'release-*'  # Triggers on tags starting with 'release-'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --icon=Bmat.ico --name=Stockpiler Stockpiler.py
        
    - name: Copy additional files
      run: |
        copy *.csv dist/
        copy Bmat.ico dist/
        xcopy /E /I CheckImages dist\CheckImages
        xcopy /E /I UI dist\UI
        xcopy /E /I Compare dist\Compare
        xcopy /E /I Stockpiles dist\Stockpiles
        
    - name: Create release archive
      run: |
        cd dist
        powershell Compress-Archive -Path * -DestinationPath ../Stockpiler-Windows.zip
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Stockpiler-Windows
        path: |
          Stockpiler-Windows.zip
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-')
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: Stockpiler-Windows
        path: ./release-files
        
    - name: Extract release name from tag
      id: extract_release_name
      run: |
        # Remove 'release-' prefix from tag name
        RELEASE_NAME=${GITHUB_REF#refs/tags/release-}
        echo "name=$RELEASE_NAME" >> $GITHUB_OUTPUT
        echo "Release name will be: $RELEASE_NAME"
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ steps.extract_release_name.outputs.name }}
        body: |
          Automated release of Stockpiler application.
          
          **Download:**
          - Windows: Stockpiler-Windows.zip (contains executable and all required files)
          
          Built from tag: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
        files: |
          ./release-files/Stockpiler-Windows.zip
        draft: true
        prerelease: false
