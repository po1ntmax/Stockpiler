name: Build and Release

on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --icon=Bmat.ico --name=Stockpiler Stockpiler.py
        
    - name: Copy additional files
      run: |
        copy *.csv dist/
        copy Bmat.ico dist/
        xcopy /E /I CheckImages dist\CheckImages
        xcopy /E /I UI dist\UI
        xcopy /E /I Compare dist\Compare
        xcopy /E /I Stockpiles dist\Stockpiles
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Stockpiler-Windows
        path: dist/
        if-no-files-found: error

